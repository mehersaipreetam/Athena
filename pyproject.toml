[project]
name = "athena"
version = "0.1.0"
description = "Athena Voice Assistant with MCP Tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "google-generativeai>=0.8.5",
    "mcp>=1.9.0",
    "piper-tts>=1.3.0",
    "pytz>=2024.1",
    "pynput>=1.8.1",
    "python-dotenv>=1.1.1",
    "rich>=14.1.0",
    "sounddevice>=0.5.2",
    "vosk>=0.3.45",
]

[project.scripts]
athena = "core.base_assistant:run_assistant"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "black>=25.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
